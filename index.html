<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JavaScript課題</title>
    <style>
        #displayArea {
            border: 1px solid #333;
            padding: 10px;
            margin-top: 10px;
            width: 300px;
            height: 50px;
        }

        .highlight {
            background-color: yellow;
        }

        table, td, th {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }

        #myTable {
            margin-top: 10px;
            width: 300px;
        }
    </style>
</head>
<body>

    <input type="text" id="textInput" placeholder="入力してください">
    <button id="showBtn">表示</button>
    <button id="bgBtn">背景色を変更</button>

    <div id="displayArea"></div>

    <table id="myTable">
        <tr><th>テキスト</th><th>操作</th></tr>
    </table>

    <p>追加回数：<span id="count">0</span></p>

    <script src="script.js"></script>
</body>
</html>
